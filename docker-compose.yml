services:
  assessment:
    build:
      context: ./backend
      dockerfile: services/assessment/Dockerfile
    env_file: ./backend/.env
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  matching:
    build:
      context: ./backend
      dockerfile: services/matching/Dockerfile
    env_file: ./backend/.env
    ports:

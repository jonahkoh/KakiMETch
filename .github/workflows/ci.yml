name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          .github/scripts/check-commit-messages.sh "$range"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Validate build artifact
        run: test -d .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    name: Backend (${{ matrix.unit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit:
          - libs/kakimetch_common
          - services/assessment
          - services/matching
          - services/registry
          - services/scheduling
          - scripts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/**/requirements*.txt
      - run: python -m pip install --upgrade pip
      - name: Install shared lib, dev tools and unit requirements
        run: |
          reqs="-r requirements-dev.txt"
          if [ -f "${{ matrix.unit }}/requirements.txt" ]; then reqs="$reqs -r ${{ matrix.unit }}/requirements.txt"; fi
          echo "REQS=$reqs" >> "$GITHUB_ENV"
          python -m pip install -e libs/kakimetch_common $reqs
      - run: black --check ${{ matrix.unit }}
      - run: pytest ${{ matrix.unit }}
      - name: Python dependency audit report
        continue-on-error: true
        run: pip-audit $REQS --vulnerability-service osv

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder env file (no secrets)
        run: touch backend/.env
      - run: docker compose build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --redact --verbose
